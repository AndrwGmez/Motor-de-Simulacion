name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @flowverse/contracts...
      - run: pnpm contracts:check

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowverse_test
          POSTGRES_USER: flowverse
          POSTGRES_PASSWORD: flowverse_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowverse -d flowverse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://flowverse:flowverse_test_password@localhost:5432/flowverse_test?sslmode=disable
      TEST_DATABASE_URL: postgres://flowverse:flowverse_test_password@localhost:5432/flowverse_test?sslmode=disable
      STORE_DRIVER: postgres
      AUTO_MIGRATE: "true"
      FLOW_PARSER_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/api/go.sum
      - name: Unit and integration tests
        working-directory: apps/api
        run: go test -coverprofile=coverage.out ./...
      - name: Race detector
        working-directory: apps/api
        run: go test -race ./...
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Build
        working-directory: apps/api
        run: go build -buildvcs=false -trimpath ./cmd/api

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @flowverse/web...
      # La app consume los paquetes compilados, así que se construyen primero.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @flowverse/web lint
      - run: pnpm --filter @flowverse/web typecheck
      - run: pnpm --filter @flowverse/web test
      - run: pnpm --filter @flowverse/web build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs:
      - web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @flowverse/web...
      - run: pnpm --filter "./packages/*" build
      - name: Install Chromium
        run: pnpm --filter @flowverse/web exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm --filter @flowverse/web test:e2e

  e2e-fullstack:
    name: Playwright full-stack
    runs-on: ubuntu-latest
    needs:
      - contracts
      - api
      - web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @flowverse/web...
      - run: pnpm --filter "./packages/*" build
      - name: Install Chromium
        run: pnpm --filter @flowverse/web exec playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up --build --wait --detach
      - name: Real browser journey against API, PostgreSQL and WebSocket
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          FLOWVERSE_API_URL: http://localhost:8080
        run: pnpm test:e2e:full
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs:
      - contracts
      - api
      - web
      - e2e
      - e2e-fullstack
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
