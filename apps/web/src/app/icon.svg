<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FlowVerse 3D">
  <title>FlowVerse 3D</title>
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E86FF"/>
      <stop offset="1" stop-color="#6650D8"/>
    </linearGradient>
  </defs>

  <!-- Misma pastilla y degradado que el distintivo de la cabecera. -->
  <rect width="64" height="64" rx="18" fill="url(#marca)"/>

  <!--
    Un flujo que se aleja en profundidad. La cadena avanza en diagonal y los
    nodos menguan con la distancia: el escorzo se lee sin necesidad de dibujar
    una perspectiva completa. Se evita a propósito la composición centrada y
    simétrica, que a 16 píxeles se confunde con un ojo o con un átomo.
  -->
  <g stroke="#EEF1FF" stroke-linecap="round" fill="none">
    <path d="M17.5 45.5 30 34" stroke-width="3.6"/>
    <path d="M35.5 30 44 22.5" stroke-width="2.6" opacity=".82"/>
    <path d="M35 33.5 46.5 36" stroke-width="2.2" opacity=".7"/>
  </g>

  <!-- Cerca: nodo grande y sólido. -->
  <circle cx="15" cy="48" r="7.2" fill="#EEF1FF"/>
  <!-- Media distancia: la decisión que bifurca. -->
  <path d="M32.5 26.6 38.4 32.5 32.5 38.4 26.6 32.5z" fill="#EEF1FF" opacity=".95"/>
  <!-- Lejos: dos resultados, menores y algo más tenues. -->
  <circle cx="46.5" cy="20.5" r="4.3" fill="#35D39D"/>
  <circle cx="49" cy="37" r="3.4" fill="#3FC8DC" opacity=".92"/>
</svg>
