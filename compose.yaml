name: flowverse

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowverse}
      POSTGRES_USER: ${POSTGRES_USER:-flowverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowverse_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - flowverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      STORE_DRIVER: postgres
      AUTO_MIGRATE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-flowverse}:${POSTGRES_PASSWORD:-flowverse_local_password}@postgres:5432/${POSTGRES_DB:-flowverse}?sslmode=disable
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      FLOW_PARSER_PROVIDER: ${FLOW_PARSER_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 15s

volumes:
  flowverse_postgres_data:
